<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gallery</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 24px 20px; font-family: sans-serif; background: #f5f7fa; color: #202938; }
    main { width: 100%; max-width: 820px; margin: auto; }
    nav { margin-bottom: 24px; }
    nav a { color: #245bd6; }
    form { margin: 0; }
    .controls { display: flex; gap: 10px; }
    input { flex: 1; min-width: 0; padding: 14px; border: 1px solid #8993a3; border-radius: 8px; font: inherit; }
    button { padding: 14px 22px; border: 0; border-radius: 8px; background: #245bd6; color: white; font: inherit; cursor: pointer; }
    button:hover { background: #1948b0; }
    :focus-visible { outline: 3px solid #668bee; outline-offset: 3px; }
    #status { margin: 16px 0; line-height: 1.7; overflow-wrap: anywhere; }
    #status:empty { display: none; }
    #status[data-state="error"] { color: #a32626; }
    #images { display: flex; flex-direction: column; gap: 24px; padding: 0; margin: 24px 0 0; list-style: none; }
    figure { margin: 0; }
    img { display: block; max-width: 100%; width: auto; height: auto; margin: auto; }
    figure.pending { min-height: 65vh; display: flex; flex-direction: column; justify-content: center; }
    .image-message { padding: 20px 0; line-height: 1.7; }
    .retry { align-self: flex-start; margin-bottom: 12px; }
    .direct { margin: 20px 0; padding: 18px; border: 1px solid #d6dce6; border-radius: 10px; background: white; }
    .direct h2 { margin: 0 0 12px; font-size: 1rem; }
    .direct p, .direct li { line-height: 1.7; }
    .direct ol { padding-left: 24px; }
    .bookmarklet { display: inline-block; padding: 8px 12px; border: 1px solid #245bd6; border-radius: 6px; color: #245bd6; text-decoration: none; }
    #direct-status { color: #a32626; }
    #direct-status:empty { display: none; }
    [hidden] { display: none !important; }
    @media (max-width: 480px) { body { padding: 20px 14px; } .controls { flex-direction: column; } }
  </style>
  <script src="./config.js" defer></script>
  <script src="./app.js" defer></script>
  <script src="./gallery-direct.js" defer></script>
</head>
<body>
  <main>
    <nav aria-label="ナビゲーション"><a href="./index.html">ホームへ戻る</a></nav>
    <form id="url-form">
      <div class="controls">
        <input id="url" name="url" type="url" aria-label="URL" autocomplete="url" required>
        <button id="enter" type="submit">Enter</button>
      </div>
    </form>
    <p id="status" role="status" aria-live="polite"></p>
    <section id="direct-help" class="direct" aria-labelledby="direct-heading" hidden>
      <h2 id="direct-heading">元サイトで縦表示する方法</h2>
      <p>元サイトが画像取得サーバーからのアクセスを制限しています。元サイトをブラウザで表示できる場合は、次の方法で縦表示できます。</p>
      <ol>
        <li><a id="gallery-bookmarklet" class="bookmarklet" href="#" draggable="true" title="ブックマークバーへドラッグしてください">ギャラリーを縦表示</a> をブラウザのブックマークバーへドラッグして登録します（初回のみ）。</li>
        <li><button id="open-original" type="button">元サイトで開く</button> を押します。</li>
        <li>元サイトのギャラリーが表示されたら、登録したブックマークを押します。</li>
      </ol>
      <p>e-hentai.org専用です。元サイト上で縦表示し、スクロールに合わせて読み込みます。</p>
      <p id="direct-status" role="status" aria-live="polite"></p>
    </section>
    <section id="results" aria-label="画像" hidden>
      <ol id="images"></ol>
    </section>
  </main>
</body>
</html>
