<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>shakemaru110.github.io</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 24px 20px; font-family: sans-serif; background: #f5f7fa; color: #202938; }
    main { width: 100%; max-width: 820px; margin: auto; }
    h1 { font-size: 1.5rem; overflow-wrap: anywhere; }
    nav { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; margin-top: 24px; }
    nav a { display: block; padding: 28px 24px; border: 1px solid #d6dce6; border-radius: 12px; background: white; color: #245bd6; font-size: 1.25rem; text-decoration: none; }
    nav a:hover { border-color: #245bd6; background: #edf2ff; }
    :focus-visible { outline: 3px solid #668bee; outline-offset: 3px; }
    @media (max-width: 480px) { body { padding: 20px 14px; } nav { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <main>
    <h1>shakemaru110.github.io</h1>
    <nav aria-label="ページ一覧">
      <a href="./gallery.html">Gallery</a>
      <a href="./metronome.html">Metronome</a>
    </nav>
  </main>
</body>
</html>
